<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能记账</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background:#f5f5f5; color:#333; max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
.tabs { display:flex; background:#fff; border-top:1px solid #e0e0e0; position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; z-index:10; }
.tab { flex:1; text-align:center; padding:8px 0; font-size:12px; color:#999; cursor:pointer; }
.tab.active { color:#4A90D9; }
.tab-icon { font-size:20px; display:block; }
.page { display:none; flex:1; padding:16px; padding-bottom:70px; overflow-y:auto; }
.page.active { display:block; }
.header { background:#4A90D9; color:#fff; padding:16px; text-align:center; font-size:18px; font-weight:700; }
.card-row { display:flex; gap:12px; margin-bottom:12px; }
.card { flex:1; background:#fff; border-radius:12px; padding:14px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.card-label { font-size:12px; color:#888; margin-bottom:4px; }
.card-val { font-size:20px; font-weight:700; }
.card-val.green { color:#4CAF50; }
.card-val.red { color:#F44336; }
.balance-bar { background:#4A90D9; border-radius:12px; padding:12px; text-align:center; color:#fff; font-weight:600; margin-bottom:16px; }
.section-title { font-size:15px; font-weight:600; margin-bottom:8px; }
.txn-item { display:flex; align-items:center; background:#fff; border-radius:10px; padding:12px; margin-bottom:8px; box-shadow:0 1px 4px rgba(0,0,0,.04); cursor:pointer; }
.txn-info { flex:1; }
.txn-cat { font-size:14px; font-weight:600; }
.txn-note { font-size:12px; color:#888; margin-top:2px; }
.txn-date { font-size:11px; color:#bbb; margin-top:2px; }
.txn-amt { font-size:16px; font-weight:700; }
.empty { text-align:center; color:#bbb; margin-top:40px; }
.type-row { display:flex; gap:10px; margin-bottom:16px; }
.type-btn { flex:1; padding:12px; border-radius:10px; text-align:center; font-size:15px; font-weight:600; background:#e0e0e0; color:#666; cursor:pointer; border:none; }
.type-btn.active-expense { background:#F44336; color:#fff; }
.type-btn.active-income { background:#4CAF50; color:#fff; }
label.field { display:block; font-size:13px; font-weight:600; color:#555; margin:12px 0 6px; }
.input { width:100%; background:#fff; border:1px solid #e0e0e0; border-radius:10px; padding:12px; font-size:15px; outline:none; }
.input:focus { border-color:#4A90D9; }
.ai-tip { background:#E3F2FD; border-radius:8px; padding:10px; margin-top:8px; color:#1976D2; font-size:13px; cursor:pointer; }
.cat-grid { display:flex; flex-wrap:wrap; gap:8px; }
.cat-chip { padding:8px 16px; border-radius:20px; background:#e0e0e0; font-size:13px; color:#666; cursor:pointer; border:none; }
.cat-chip.active { background:#4A90D9; color:#fff; font-weight:600; }
.save-btn { width:100%; background:#4A90D9; color:#fff; border:none; border-radius:12px; padding:14px; font-size:16px; font-weight:700; cursor:pointer; margin-top:20px; }
.save-btn:hover { background:#3a7bc8; }
.month-nav { display:flex; justify-content:center; align-items:center; gap:20px; margin-bottom:16px; }
.month-nav button { background:none; border:none; font-size:20px; color:#4A90D9; cursor:pointer; }
.month-text { font-size:18px; font-weight:700; }
.chart-box { background:#fff; border-radius:12px; padding:16px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.bar-row { display:flex; align-items:center; margin-bottom:10px; }
.bar-label { width:50px; font-size:13px; text-align:right; margin-right:8px; }
.bar-bg { flex:1; height:22px; background:#e0e0e0; border-radius:4px; overflow:hidden; }
.bar-fill { height:100%; border-radius:4px; }
.bar-val { width:70px; font-size:12px; text-align:right; margin-left:6px; }
.pie-container { display:flex; align-items:center; gap:16px; }
.pie-legend { font-size:13px; }
.pie-legend-item { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
.pie-dot { width:10px; height:10px; border-radius:50%; }
.budget-total { background:#fff; border-radius:12px; padding:16px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.budget-total-val { font-size:26px; font-weight:700; margin:4px 0; }
.progress-bg { height:8px; background:#e0e0e0; border-radius:4px; margin-top:8px; }
.progress-fill { height:8px; border-radius:4px; }
.budget-add { background:#fff; border-radius:12px; padding:12px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.budget-add-row { display:flex; gap:8px; margin-top:10px; }
.budget-add-row .input { flex:1; }
.budget-add-btn { background:#4A90D9; color:#fff; border:none; border-radius:8px; padding:10px 20px; font-weight:600; cursor:pointer; }
.budget-item { background:#fff; border-radius:10px; padding:12px; margin-bottom:8px; box-shadow:0 1px 4px rgba(0,0,0,.04); cursor:pointer; }
.budget-header { display:flex; justify-content:space-between; margin-bottom:4px; }
.over-text { color:#F44336; font-size:12px; margin-top:4px; }
.settings-center { text-align:center; padding-top:30px; }
.app-name { font-size:24px; font-weight:700; color:#4A90D9; }
.app-ver { font-size:14px; color:#999; margin-bottom:30px; }
.setting-item { background:#fff; border:1px solid #e0e0e0; border-radius:12px; padding:14px; margin-bottom:12px; font-size:15px; cursor:pointer; text-align:left; }
.setting-item.danger { border-color:#F44336; color:#F44336; }
.login-page { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:30px; background:linear-gradient(135deg,#4A90D9,#357ABD); }
.login-box { background:#fff; border-radius:16px; padding:32px 24px; width:100%; max-width:360px; box-shadow:0 8px 30px rgba(0,0,0,.15); }
.login-title { text-align:center; font-size:24px; font-weight:700; color:#4A90D9; margin-bottom:4px; }
.login-sub { text-align:center; font-size:13px; color:#999; margin-bottom:24px; }
.login-input { width:100%; background:#f5f5f5; border:1px solid #e0e0e0; border-radius:10px; padding:12px; font-size:15px; outline:none; margin-bottom:12px; }
.login-input:focus { border-color:#4A90D9; }
.login-btn { width:100%; background:#4A90D9; color:#fff; border:none; border-radius:10px; padding:14px; font-size:16px; font-weight:700; cursor:pointer; margin-top:8px; }
.login-btn:hover { background:#357ABD; }
.login-switch { text-align:center; margin-top:16px; font-size:13px; color:#888; }
.login-switch a { color:#4A90D9; cursor:pointer; text-decoration:none; }
.user-badge { display:inline-block; background:#fff3; border-radius:8px; padding:2px 10px; font-size:12px; color:#fff; margin-left:8px; cursor:pointer; }
canvas { display:block; margin:0 auto; }
</style>
</head>
<body>

<div class="header">智能记账 <span id="user-badge" class="user-badge" onclick="logout()" style="display:none"></span></div>

<div id="page-login" class="login-page">
  <div class="login-box">
    <div class="login-title">智能记账</div>
    <div class="login-sub" id="login-sub">登录你的账本</div>
    <input class="login-input" id="login-user" placeholder="用户名" onkeydown="if(event.key==='Enter')document.getElementById('login-pass').focus()">
    <input class="login-input" id="login-pass" type="password" placeholder="密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" id="login-btn" onclick="doLogin()">登录</button>
    <div class="login-switch" id="login-switch">还没有账号？<a onclick="toggleRegister()">注册</a></div>
  </div>
</div>

<div id="page-home" class="page">
  <div class="card-row">
    <div class="card"><div class="card-label">今日收入</div><div id="today-income" class="card-val green">+0.00</div></div>
    <div class="card"><div class="card-label">今日支出</div><div id="today-expense" class="card-val red">-0.00</div></div>
  </div>
  <div class="card-row">
    <div class="card"><div class="card-label">本月收入</div><div id="month-income" class="card-val green">+0.00</div></div>
    <div class="card"><div class="card-label">本月支出</div><div id="month-expense" class="card-val red">-0.00</div></div>
  </div>
  <div id="balance-bar" class="balance-bar"></div>
  <div class="section-title">最近记录</div>
  <div id="recent-list"></div>
</div>

<div id="page-add" class="page">
  <div class="type-row">
    <button class="type-btn active-expense" id="btn-expense" onclick="setType('expense')">支出</button>
    <button class="type-btn" id="btn-income" onclick="setType('income')">收入</button>
  </div>
  <label class="field">金额</label>
  <input class="input" id="add-amount" type="number" placeholder="0.00" step="0.01">
  <label class="field">备注</label>
  <input class="input" id="add-note" placeholder="输入备注，AI自动推荐分类" oninput="onNoteInput()">
  <div id="ai-tip" class="ai-tip" style="display:none" onclick="applySuggestion()"></div>
  <label class="field">分类</label>
  <div id="cat-grid" class="cat-grid"></div>
  <button class="save-btn" onclick="saveTransaction()">保存</button>
</div>

<div id="page-stats" class="page">
  <div class="month-nav">
    <button onclick="changeStatsMonth(-1)">◀</button>
    <span id="stats-month" class="month-text"></span>
    <button onclick="changeStatsMonth(1)">▶</button>
  </div>
  <div class="card-row">
    <div class="card"><div class="card-label">收入</div><div id="stats-income" class="card-val green">¥0</div></div>
    <div class="card"><div class="card-label">支出</div><div id="stats-expense" class="card-val red">¥0</div></div>
  </div>
  <div class="section-title">支出分类占比</div>
  <div class="chart-box">
    <div class="pie-container"><canvas id="pie-chart" width="140" height="140"></canvas><div id="pie-legend" class="pie-legend"></div></div>
  </div>
  <div class="section-title">支出分类排行</div>
  <div id="bar-chart" class="chart-box"></div>
  <button class="save-btn" style="margin-top:8px;margin-bottom:12px" onclick="toggleMonthlyTrend()">📈 查看月度费用趋势</button>
  <div id="monthly-trend" style="display:none">
    <div class="section-title">近12个月费用趋势</div>
    <div class="chart-box" style="overflow-x:auto">
      <canvas id="trend-chart" width="460" height="220"></canvas>
    </div>
  </div>
</div>

<div id="page-budget" class="page">
  <div class="budget-total">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div class="card-label">本月总预算</div>
      <button style="background:none;border:1px solid #4A90D9;border-radius:6px;padding:4px 12px;color:#4A90D9;font-size:12px;cursor:pointer" onclick="editTotalBudget()">设定总预算</button>
    </div>
    <div id="budget-total-val" class="budget-total-val">¥0</div>
    <div class="progress-bg"><div id="budget-total-fill" class="progress-fill"></div></div>
    <div id="budget-total-info" style="font-size:13px;margin-top:6px;color:#666;"></div>
  </div>
  <div class="section-title">添加分类预算</div>
  <div class="budget-add">
    <div id="budget-cat-chips" class="cat-grid"></div>
    <div class="budget-add-row">
      <input class="input" id="budget-amt" type="number" placeholder="预算金额">
      <button class="budget-add-btn" onclick="saveBudget()">设定</button>
    </div>
  </div>
  <div class="section-title">各分类预算</div>
  <div id="budget-list"></div>
</div>

<div id="page-settings" class="page">
  <div class="settings-center">
    <div class="app-name">智能记账</div>
    <div class="app-ver">v1.0.0 Web版</div>
  </div>
  <div class="setting-item" onclick="exportCSV()">📤 导出数据（CSV）</div>
  <div class="setting-item" onclick="document.getElementById('wechat-file').click()">📥 导入微信账单（CSV）</div>
  <input type="file" id="wechat-file" accept=".csv" style="display:none" onchange="importWechatCSV(this)">
  <div class="setting-item" onclick="logout()">🚪 退出登录</div>
  <div class="setting-item danger" onclick="clearAll()">🗑️ 清除所有数据</div>
</div>

<div class="tabs">
  <div class="tab" onclick="switchTab('home')"><span class="tab-icon">🏠</span>总览</div>
  <div class="tab" onclick="switchTab('add')"><span class="tab-icon">➕</span>记一笔</div>
  <div class="tab" onclick="switchTab('stats')"><span class="tab-icon">📊</span>统计</div>
  <div class="tab" onclick="switchTab('budget')"><span class="tab-icon">💰</span>预算</div>
  <div class="tab" onclick="switchTab('settings')"><span class="tab-icon">⚙️</span>设置</div>
</div>

<script>
// ========== 用户管理 ==========
const USERS_KEY = 'smartledger_users';
let currentUser = null;
function getUsers() { return JSON.parse(localStorage.getItem(USERS_KEY) || '{}'); }
function saveUsers(u) { localStorage.setItem(USERS_KEY, JSON.stringify(u)); }

let isRegisterMode = false;
function toggleRegister() {
  isRegisterMode = !isRegisterMode;
  document.getElementById('login-sub').textContent = isRegisterMode ? '创建新账本' : '登录你的账本';
  document.getElementById('login-btn').textContent = isRegisterMode ? '注册' : '登录';
  document.getElementById('login-switch').innerHTML = isRegisterMode
    ? '已有账号？<a onclick="toggleRegister()">登录</a>'
    : '还没有账号？<a onclick="toggleRegister()">注册</a>';
}

function doLogin() {
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  if (!user || !pass) { alert('请输入用户名和密码'); return; }
  const users = getUsers();
  if (isRegisterMode) {
    if (users[user]) { alert('用户名已存在'); return; }
    users[user] = pass; saveUsers(users);
    alert('注册成功！'); isRegisterMode = false;
  }
  if (!users[user]) { alert('用户不存在'); return; }
  if (users[user] !== pass) { alert('密码错误'); return; }
  currentUser = user;
  sessionStorage.setItem('smartledger_current_user', user);
  enterApp();
}

function logout() {
  if (!confirm('确定退出登录？')) return;
  currentUser = null; _txnCache = null; _classifyCache = null;
  sessionStorage.removeItem('smartledger_current_user');
  document.getElementById('page-login').style.display = 'flex';
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelector('.tabs').style.display = 'none';
  document.querySelector('.header').style.display = 'none';
  document.getElementById('login-user').value = '';
  document.getElementById('login-pass').value = '';
}

function enterApp() {
  document.getElementById('page-login').style.display = 'none';
  document.querySelector('.tabs').style.display = 'flex';
  document.querySelector('.header').style.display = 'block';
  document.getElementById('user-badge').textContent = currentUser + ' ✕';
  document.getElementById('user-badge').style.display = 'inline-block';
  _txnCache = null; _classifyCache = null;
  switchTab('home');
}

// ========== 数据存储（带缓存）==========
let _txnCache = null;
function storeKey() { return 'smartledger_' + currentUser + '_transactions'; }
function budgetKey() { return 'smartledger_' + currentUser + '_budgets'; }
function totalBudgetKey() { return 'smartledger_' + currentUser + '_totalbudget'; }

function loadTxns() {
  if (!_txnCache) _txnCache = JSON.parse(localStorage.getItem(storeKey()) || '[]');
  return _txnCache;
}
function saveTxns(txns) {
  _txnCache = txns;
  localStorage.setItem(storeKey(), JSON.stringify(txns));
  _classifyCache = null;
}
function loadBudgets() { return JSON.parse(localStorage.getItem(budgetKey()) || '[]'); }
function saveBudgets(b) { localStorage.setItem(budgetKey(), JSON.stringify(b)); }

function today() { return new Date().toISOString().slice(0,10); }
function currentMonth() { return today().slice(0,7); }

// ========== AI分类（带缓存）==========
const KEYWORD_MAP = {
  '餐饮':['早餐','午餐','晚餐','外卖','美团','饿了么','星巴克','奶茶','咖啡','火锅','烧烤','面包','蛋糕','食堂','餐厅','饭'],
  '交通':['滴滴','打车','公交','地铁','高铁','火车','飞机','机票','加油','停车','出租车'],
  '购物':['淘宝','京东','拼多多','超市','商场','衣服','鞋','包','电子产品'],
  '娱乐':['电影','游戏','KTV','旅游','门票','演出','音乐','健身'],
  '居住':['房租','水电','物业','维修','家具','装修','宽带'],
  '医疗':['医院','药','体检','看病','挂号','门诊'],
  '教育':['学费','培训','课程','书','考试','辅导'],
  '通讯':['话费','流量','手机','充值'],
  '工资':['工资','薪资','奖金','年终奖','提成'],
  '理财':['利息','分红','基金','股票','收益','红包','转账收入'],
  '其他收入':['报销','退款','兼职'],
};
const DEFAULT_EXPENSE_CATS = ['餐饮','交通','购物','娱乐','居住','医疗','教育','通讯','其他'];
const DEFAULT_INCOME_CATS = ['工资','理财','其他收入'];

function customCatKey() { return 'smartledger_' + currentUser + '_customcats'; }
function loadCustomCats() { return JSON.parse(localStorage.getItem(customCatKey()) || '{"expense":[],"income":[]}'); }
function saveCustomCats(c) { localStorage.setItem(customCatKey(), JSON.stringify(c)); }
function getExpenseCats() { return [...DEFAULT_EXPENSE_CATS, ...loadCustomCats().expense]; }
function getIncomeCats() { return [...DEFAULT_INCOME_CATS, ...loadCustomCats().income]; }
const COLORS = ['#F44336','#E91E63','#9C27B0','#3F51B5','#2196F3','#00BCD4','#4CAF50','#FF9800','#795548'];

let _classifyCache = null;
function buildClassifyCache() {
  if (_classifyCache) return _classifyCache;
  const freq = {};
  for (const t of loadTxns()) {
    if (!t.note) continue;
    const k = t.note.trim().toLowerCase();
    if (!freq[k]) freq[k] = {};
    freq[k][t.category] = (freq[k][t.category]||0) + 1;
  }
  _classifyCache = freq;
  return freq;
}

function classify(note) {
  if (!note) return null;
  const key = note.trim().toLowerCase();
  const freq = buildClassifyCache();
  if (freq[key]) {
    let best='', max=0;
    for (const [cat,cnt] of Object.entries(freq[key])) { if(cnt>max){max=cnt;best=cat;} }
    if (max>=2) return best;
  }
  for (const [cat, kws] of Object.entries(KEYWORD_MAP)) {
    for (const kw of kws) { if (key.includes(kw)) return cat; }
  }
  return null;
}

// ========== 导航 ==========
let currentTab = 'home';
function switchTab(name) {
  currentTab = name;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(t => t.classList.remove('active'));
  tabs[['home','add','stats','budget','settings'].indexOf(name)].classList.add('active');
  if (name==='home') renderHome();
  else if (name==='add') renderAddPage();
  else if (name==='stats') renderStats();
  else if (name==='budget') renderBudget();
}

// ========== 首页（单次遍历）==========
function renderHome() {
  const txns = loadTxns();
  const td = today(), mn = currentMonth();
  let todayI=0, todayE=0, monthI=0, monthE=0;
  const monthTxns = [];
  for (const t of txns) {
    if (!t.date.startsWith(mn)) continue;
    monthTxns.push(t);
    if (t.type==='income') { monthI+=t.amount; if(t.date===td) todayI+=t.amount; }
    else { monthE+=t.amount; if(t.date===td) todayE+=t.amount; }
  }
  document.getElementById('today-income').textContent = '+'+todayI.toFixed(2);
  document.getElementById('today-expense').textContent = '-'+todayE.toFixed(2);
  document.getElementById('month-income').textContent = '+'+monthI.toFixed(2);
  document.getElementById('month-expense').textContent = '-'+monthE.toFixed(2);
  document.getElementById('balance-bar').textContent = '本月结余：¥'+(monthI-monthE).toFixed(2);

  monthTxns.sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const recent = monthTxns.slice(0,20);
  const list = document.getElementById('recent-list');
  if (!recent.length) { list.innerHTML='<div class="empty">暂无记录，去记一笔吧</div>'; return; }
  const html = [];
  for (const t of recent) {
    html.push(`<div class="txn-item" onclick="if(confirm('删除这条记录？'))deleteTxn(${t.id})"><div class="txn-info"><div class="txn-cat">${t.category}</div><div class="txn-note">${t.note||'无备注'}</div><div class="txn-date">${t.date}</div></div><div class="txn-amt" style="color:${t.type==='income'?'#4CAF50':'#F44336'}">${t.type==='income'?'+':'-'}¥${t.amount.toFixed(2)}</div></div>`);
  }
  list.innerHTML = html.join('');
}

function deleteTxn(id) {
  saveTxns(loadTxns().filter(t=>t.id!==id));
  renderHome();
}

// ========== 记一笔 ==========
let addType='expense', addCategory='餐饮', aiSuggestion=null, _noteTimer=0;

function setType(type) {
  addType = type;
  document.getElementById('btn-expense').className = 'type-btn'+(type==='expense'?' active-expense':'');
  document.getElementById('btn-income').className = 'type-btn'+(type==='income'?' active-income':'');
  addCategory = (type==='expense'?getExpenseCats():getIncomeCats())[0];
  renderCatGrid();
}

function renderCatGrid() {
  const cats = addType==='expense'?getExpenseCats():getIncomeCats();
  const custom = loadCustomCats();
  const customList = addType==='expense'?custom.expense:custom.income;
  document.getElementById('cat-grid').innerHTML = cats.map(c =>
    `<button class="cat-chip${addCategory===c?' active':''}" onclick="addCategory='${c}';renderCatGrid()">${c}${customList.includes(c)?'<span style="margin-left:4px;font-size:10px;color:#f44336" onclick="event.stopPropagation();removeCustomCat(\''+c+'\')">✕</span>':''}</button>`
  ).join('') + '<button class="cat-chip" style="border:1px dashed #4A90D9;color:#4A90D9" onclick="addCustomCat()">+ 添加</button>';
}

function addCustomCat() {
  const name = prompt('请输入新分类名称：');
  if (!name || !name.trim()) return;
  const cat = name.trim();
  const all = [...getExpenseCats(), ...getIncomeCats()];
  if (all.includes(cat)) { alert('该分类已存在'); return; }
  const custom = loadCustomCats();
  if (addType==='expense') custom.expense.push(cat);
  else custom.income.push(cat);
  saveCustomCats(custom);
  addCategory = cat;
  renderCatGrid();
}

function removeCustomCat(cat) {
  if (!confirm(`确定删除自定义分类「${cat}」吗？`)) return;
  const custom = loadCustomCats();
  custom.expense = custom.expense.filter(c=>c!==cat);
  custom.income = custom.income.filter(c=>c!==cat);
  saveCustomCats(custom);
  if (addCategory===cat) addCategory = (addType==='expense'?getExpenseCats():getIncomeCats())[0];
  renderCatGrid();
}

function renderAddPage() {
  document.getElementById('add-amount').value='';
  document.getElementById('add-note').value='';
  document.getElementById('ai-tip').style.display='none';
  aiSuggestion=null;
  setType('expense');
}

function onNoteInput() {
  clearTimeout(_noteTimer);
  _noteTimer = setTimeout(function() {
    const note = document.getElementById('add-note').value;
    const s = classify(note);
    aiSuggestion = s;
    const tip = document.getElementById('ai-tip');
    if (s && s !== addCategory) {
      tip.textContent = '🤖 AI推荐分类：'+s+'（点击应用）';
      tip.style.display = 'block';
    } else {
      tip.style.display = 'none';
    }
  }, 150);
}

function applySuggestion() {
  if (!aiSuggestion) return;
  if (getExpenseCats().includes(aiSuggestion)) setType('expense');
  else if (getIncomeCats().includes(aiSuggestion)) setType('income');
  addCategory = aiSuggestion;
  renderCatGrid();
  document.getElementById('ai-tip').style.display='none';
  aiSuggestion=null;
}

function saveTransaction() {
  const amount = parseFloat(document.getElementById('add-amount').value);
  if (isNaN(amount)||amount<=0) { alert('请输入有效金额'); return; }
  const note = document.getElementById('add-note').value.trim();
  const txns = loadTxns();
  const id = txns.length ? Math.max(...txns.map(t=>t.id))+1 : 1;
  txns.push({ id, amount, type:addType, category:addCategory, note, date:today() });
  saveTxns(txns);
  alert('保存成功！');
  switchTab('home');
}

// ========== 统计 ==========
let statsMonth = '';

function changeStatsMonth(delta) {
  const d = new Date(statsMonth+'-01');
  d.setMonth(d.getMonth()+delta);
  statsMonth = d.toISOString().slice(0,7);
  renderStats();
}

function renderStats() {
  if (!statsMonth) statsMonth = currentMonth();
  document.getElementById('stats-month').textContent = statsMonth;
  const txns = loadTxns();
  let inc=0, exp=0;
  const catMap = {};
  for (const t of txns) {
    if (!t.date.startsWith(statsMonth)) continue;
    if (t.type==='income') inc+=t.amount;
    else { exp+=t.amount; catMap[t.category]=(catMap[t.category]||0)+t.amount; }
  }
  document.getElementById('stats-income').textContent = '¥'+inc.toFixed(2);
  document.getElementById('stats-expense').textContent = '¥'+exp.toFixed(2);

  const cats = Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  const total = cats.reduce((s,c)=>s+c[1],0);

  const canvas = document.getElementById('pie-chart');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,140,140);
  if (cats.length) {
    let start = -Math.PI/2;
    for (let i=0;i<cats.length;i++) {
      const angle = (cats[i][1]/total)*Math.PI*2;
      ctx.beginPath(); ctx.moveTo(70,70); ctx.arc(70,70,65,start,start+angle);
      ctx.fillStyle = COLORS[i%COLORS.length]; ctx.fill(); start += angle;
    }
    document.getElementById('pie-legend').innerHTML = cats.map(([cat,val],i) =>
      `<div class="pie-legend-item"><div class="pie-dot" style="background:${COLORS[i%COLORS.length]}"></div>${cat} ${(val/total*100).toFixed(1)}%</div>`
    ).join('');
  } else {
    ctx.fillStyle='#e0e0e0'; ctx.beginPath(); ctx.arc(70,70,65,0,Math.PI*2); ctx.fill();
    document.getElementById('pie-legend').innerHTML='<div style="color:#bbb">暂无数据</div>';
  }

  const maxVal = cats.length ? cats[0][1] : 1;
  document.getElementById('bar-chart').innerHTML = cats.length ? cats.map(([cat,val],i) =>
    `<div class="bar-row"><div class="bar-label">${cat}</div><div class="bar-bg"><div class="bar-fill" style="width:${(val/maxVal*100).toFixed(1)}%;background:${COLORS[i%COLORS.length]}"></div></div><div class="bar-val">¥${val.toFixed(0)}</div></div>`
  ).join('') : '<div class="empty">暂无数据</div>';

  document.getElementById('monthly-trend').style.display='none';
}

function toggleMonthlyTrend() {
  const el = document.getElementById('monthly-trend');
  if (el.style.display==='none') { el.style.display='block'; renderMonthlyTrend(); }
  else el.style.display='none';
}

function renderMonthlyTrend() {
  const txns = loadTxns();
  const now = new Date();
  const monthKeys = [];
  const labels = [];
  for (let i=11;i>=0;i--) {
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const mn = d.toISOString().slice(0,7);
    monthKeys.push(mn); labels.push(mn.slice(5));
  }
  const expMap={}, incMap={};
  for (const mn of monthKeys) { expMap[mn]=0; incMap[mn]=0; }
  for (const t of txns) {
    const mn = t.date.slice(0,7);
    if (mn in expMap) { if(t.type==='expense') expMap[mn]+=t.amount; else incMap[mn]+=t.amount; }
  }
  const expenses = monthKeys.map(m=>expMap[m]);
  const incomes = monthKeys.map(m=>incMap[m]);

  const canvas = document.getElementById('trend-chart');
  const ctx = canvas.getContext('2d');
  const W=canvas.width, H=canvas.height, padL=45, padR=10, padT=20, padB=35;
  const chartW=W-padL-padR, chartH=H-padT-padB;
  const maxVal = Math.max(...expenses,...incomes,1);
  ctx.clearRect(0,0,W,H);

  ctx.strokeStyle='#e0e0e0'; ctx.lineWidth=0.5;
  for (let i=0;i<=4;i++) {
    const y=padT+chartH*(1-i/4);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillStyle='#999'; ctx.font='10px sans-serif'; ctx.textAlign='right';
    ctx.fillText('¥'+(maxVal*i/4).toFixed(0),padL-4,y+3);
  }
  const barW=chartW/12, bw=barW*0.3;
  for (let i=0;i<12;i++) {
    const x=padL+i*barW+barW/2;
    const eh=(expenses[i]/maxVal)*chartH;
    ctx.fillStyle='#F44336'; ctx.fillRect(x-bw-1,padT+chartH-eh,bw,eh);
    const ih=(incomes[i]/maxVal)*chartH;
    ctx.fillStyle='#4CAF50'; ctx.fillRect(x+1,padT+chartH-ih,bw,ih);
    ctx.fillStyle='#666'; ctx.font='11px sans-serif'; ctx.textAlign='center';
    ctx.fillText(labels[i],x,H-padB+15);
  }
  ctx.fillStyle='#F44336'; ctx.fillRect(padL,H-12,10,10);
  ctx.fillStyle='#333'; ctx.font='11px sans-serif'; ctx.textAlign='left';
  ctx.fillText('支出',padL+14,H-3);
  ctx.fillStyle='#4CAF50'; ctx.fillRect(padL+50,H-12,10,10);
  ctx.fillStyle='#333'; ctx.fillText('收入',padL+64,H-3);
}

// ========== 预算 ==========
let budgetCat = DEFAULT_EXPENSE_CATS[0];

function renderBudget() {
  const mn = currentMonth();
  const budgets = loadBudgets().filter(b=>b.month===mn);
  const txns = loadTxns();
  let totalSpent=0;
  const spentMap = {};
  for (const t of txns) {
    if (!t.date.startsWith(mn)||t.type!=='expense') continue;
    totalSpent += t.amount;
    spentMap[t.category]=(spentMap[t.category]||0)+t.amount;
  }

  const totalBudgetData = JSON.parse(localStorage.getItem(totalBudgetKey()) || '{}');
  const totalB = totalBudgetData[mn] || 0;
  const bvEl = document.getElementById('budget-total-val');
  if (totalB > 0) {
    const pct = Math.min(totalSpent/totalB*100,100);
    const over = totalSpent > totalB;
    bvEl.textContent = '¥'+totalB.toFixed(2); bvEl.style.color='#333';
    document.getElementById('budget-total-fill').style.width = pct+'%';
    document.getElementById('budget-total-fill').style.backgroundColor = over?'#F44336':'#4CAF50';
    document.getElementById('budget-total-info').innerHTML = `已花 ¥${totalSpent.toFixed(2)} / 剩余 ¥${Math.max(totalB-totalSpent,0).toFixed(2)}`+(over?' <span style="color:#F44336">⚠️ 已超支</span>':'');
    document.getElementById('budget-total-info').style.color = over?'#F44336':'#666';
  } else {
    bvEl.textContent = '未设定'; bvEl.style.color='#bbb';
    document.getElementById('budget-total-fill').style.width = '0%';
    document.getElementById('budget-total-info').textContent = '点击右上角「设定总预算」来设置本月预算';
    document.getElementById('budget-total-info').style.color = '#999';
  }

  const customB = loadCustomCats().expense;
  document.getElementById('budget-cat-chips').innerHTML = getExpenseCats().map(c =>
    `<button class="cat-chip${budgetCat===c?' active':''}" onclick="budgetCat='${c}';renderBudget()">${c}${customB.includes(c)?'<span style="margin-left:4px;font-size:10px;color:#f44336" onclick="event.stopPropagation();removeBudgetCat(\''+c+'\')">✕</span>':''}</button>`
  ).join('') + '<button class="cat-chip" style="border:1px dashed #4A90D9;color:#4A90D9" onclick="addBudgetCat()">+ 添加</button>';

  const list = document.getElementById('budget-list');
  if (!budgets.length) { list.innerHTML='<div class="empty">暂未设定分类预算</div>'; return; }
  const html = [];
  for (const b of budgets) {
    const spent=spentMap[b.category]||0, p=Math.min(spent/(b.amount||1)*100,100), over=spent>b.amount;
    html.push(`<div class="budget-item" onclick="if(confirm('删除「${b.category}」的预算？'))deleteBudgetItem('${b.category}')"><div class="budget-header"><span style="font-weight:600">${b.category}</span><span style="color:${over?'#F44336':'#666'}">¥${spent.toFixed(0)} / ¥${b.amount.toFixed(0)}</span></div><div class="progress-bg"><div class="progress-fill" style="width:${p}%;background:${over?'#F44336':'#4A90D9'}"></div></div>${over?`<div class="over-text">⚠️ 已超支 ¥${(spent-b.amount).toFixed(2)}</div>`:''}</div>`);
  }
  list.innerHTML = html.join('');
}

function addBudgetCat() {
  const name = prompt('请输入新分类名称：');
  if (!name || !name.trim()) return;
  const cat = name.trim();
  const all = [...getExpenseCats(), ...getIncomeCats()];
  if (all.includes(cat)) { alert('该分类已存在'); return; }
  const custom = loadCustomCats();
  custom.expense.push(cat);
  saveCustomCats(custom);
  budgetCat = cat;
  renderBudget();
}

function removeBudgetCat(cat) {
  if (!confirm(`确定删除自定义分类「${cat}」吗？`)) return;
  const custom = loadCustomCats();
  custom.expense = custom.expense.filter(c=>c!==cat);
  custom.income = custom.income.filter(c=>c!==cat);
  saveCustomCats(custom);
  if (budgetCat===cat) budgetCat = getExpenseCats()[0];
  renderBudget();
}

function editTotalBudget() {
  const mn = currentMonth();
  const data = JSON.parse(localStorage.getItem(totalBudgetKey()) || '{}');
  const current = data[mn] || 0;
  const input = prompt('请输入本月总预算金额：', current>0?current:'');
  if (input===null) return;
  const val = parseFloat(input);
  if (isNaN(val)||val<0) { alert('请输入有效金额'); return; }
  if (val===0) delete data[mn]; else data[mn]=val;
  localStorage.setItem(totalBudgetKey(), JSON.stringify(data));
  renderBudget();
}

function saveBudget() {
  const amt = parseFloat(document.getElementById('budget-amt').value);
  if (isNaN(amt)||amt<=0) { alert('请输入有效预算金额'); return; }
  const mn = currentMonth();
  let budgets = loadBudgets().filter(b=>!(b.category===budgetCat&&b.month===mn));
  budgets.push({ category:budgetCat, amount:amt, month:mn });
  saveBudgets(budgets);
  document.getElementById('budget-amt').value='';
  renderBudget();
}

function deleteBudgetItem(cat) {
  saveBudgets(loadBudgets().filter(b=>!(b.category===cat&&b.month===currentMonth())));
  renderBudget();
}

// ========== 设置 ==========
function exportCSV() {
  const txns = loadTxns();
  if (!txns.length) { alert('暂无数据可导出'); return; }
  const csv = '日期,类型,分类,金额,备注\n' + txns.map(t =>
    `${t.date},${t.type==='income'?'收入':'支出'},${t.category},${t.amount},${(t.note||'').replace(/,/g,'，')}`
  ).join('\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'smartledger_'+today()+'.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importWechatCSV(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const text = e.target.result;
      const lines = text.split('\n').map(l => l.trim()).filter(l => l);
      // 找到表头行
      let headerIdx = -1;
      for (let i = 0; i < Math.min(lines.length, 30); i++) {
        if (lines[i].includes('交易时间') && lines[i].includes('收/支')) {
          headerIdx = i; break;
        }
      }
      if (headerIdx === -1) { alert('无法识别微信账单格式，请确认是从微信导出的 CSV 文件'); return; }

      const headers = lines[headerIdx].split(',').map(h => h.replace(/"/g,'').trim());
      const iTime = headers.indexOf('交易时间');
      const iType = headers.findIndex(h => h.includes('收/支'));
      const iTarget = headers.findIndex(h => h.includes('交易对方'));
      const iGoods = headers.findIndex(h => h.includes('商品'));
      const iAmount = headers.findIndex(h => h.includes('金额'));
      const iStatus = headers.findIndex(h => h.includes('当前状态'));

      const txns = loadTxns();
      let maxId = txns.length ? Math.max(...txns.map(t => t.id)) : 0;
      let imported = 0, skipped = 0;

      for (let i = headerIdx + 1; i < lines.length; i++) {
        const cols = lines[i].split(',').map(c => c.replace(/"/g,'').trim());
        if (cols.length < 5) continue;

        // 跳过非成功交易
        if (iStatus >= 0) {
          const status = cols[iStatus] || '';
          if (status.includes('退款') || status.includes('已退') || status.includes('关闭') || status.includes('失败')) { skipped++; continue; }
        }

        const typeStr = cols[iType] || '';
        if (typeStr !== '支出' && typeStr !== '收入') { skipped++; continue; }

        const type = typeStr === '收入' ? 'income' : 'expense';
        const amountStr = (cols[iAmount] || '').replace(/[¥￥\s]/g, '');
        const amount = parseFloat(amountStr);
        if (isNaN(amount) || amount <= 0) { skipped++; continue; }

        const timeStr = cols[iTime] || '';
        const date = timeStr.slice(0, 10);
        if (!/^\d{4}[-\/]\d{2}[-\/]\d{2}$/.test(date)) { skipped++; continue; }

        const target = cols[iTarget] || '';
        const goods = cols[iGoods] || '';
        const note = goods || target;

        const cat = classify(note) || (type === 'income' ? getIncomeCats()[0] : getExpenseCats()[0]);

        maxId++;
        txns.push({ id: maxId, amount, type, category: cat, note, date: date.replace(/\//g, '-') });
        imported++;
      }

      saveTxns(txns);
      alert(`导入完成！\n成功：${imported} 条\n跳过：${skipped} 条（退款/非收支/格式异常）`);
      input.value = '';
      switchTab('home');
    } catch (err) {
      alert('导入失败：' + err.message);
    }
  };
  reader.readAsText(file, 'UTF-8');
}

function clearAll() {
  if (confirm('此操作不可恢复，确定要清除所有数据吗？')) {
    localStorage.removeItem(storeKey());
    localStorage.removeItem(budgetKey());
    localStorage.removeItem(totalBudgetKey());
    localStorage.removeItem(customCatKey());
    _txnCache = null; _classifyCache = null;
    alert('已清除所有数据');
    renderHome();
  }
}
